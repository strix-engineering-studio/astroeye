<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0b0d10" />
    <title>Strix Offline</title>
    <style>
        :root {
            color-scheme: dark;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            font-family: Inter, system-ui, sans-serif;
            background: radial-gradient(circle at top, rgba(216, 158, 88, 0.18), transparent 30%), linear-gradient(180deg, #060709 0%, #10131a 100%);
            color: #f5f3ee;
        }

        main {
            width: min(92vw, 560px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 24px;
            background: rgba(255, 255, 255, 0.05);
            padding: 32px;
            box-shadow: 0 24px 80px rgba(0, 0, 0, 0.35);
        }

        a {
            display: inline-flex;
            margin-top: 20px;
            padding: 12px 18px;
            border-radius: 999px;
            background: #f5f3ee;
            color: #0b0d10;
            text-decoration: none;
            font-weight: 600;
        }
    </style>
</head>

<body>
    <main>
        <p style="text-transform: uppercase; letter-spacing: 0.28em; font-size: 12px; color: rgba(255,255,255,0.72);">
            Offline</p>
        <h1 style="margin: 12px 0 0; font-size: clamp(2rem, 6vw, 3.25rem); line-height: 1.02;">You&apos;re offline, but
            Strix is still available.</h1>
        <p style="margin: 16px 0 0; font-size: 16px; line-height: 1.7; color: rgba(255,255,255,0.72);">Some cached pages
            may still open. Reconnect to load the latest content and interactions.</p>
        <a href="/">Back home</a>
    </main>
</body>

</html>
